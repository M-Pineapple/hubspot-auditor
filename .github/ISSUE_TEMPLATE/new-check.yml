name: New check idea
description: Suggest a HubSpot check the auditor does not run yet
title: "[Check]: "
labels: [enhancement]
body:
  - type: textarea
    id: check
    attributes:
      label: What should it look at
      description: The HubSpot object or setting, and what working versus broken would mean.
    validations:
      required: true
  - type: dropdown
    id: auditor
    attributes:
      label: Auditor
      options:
        - CRM
        - Pipelines
        - Forms
        - Tracking
        - Email
        - Integrations
        - Reporting
        - Brand
        - Journey
        - Program
        - Not sure / new auditor
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options:
        - critical
        - high
        - medium
        - low
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Counts, property names, or settings the check could report. No contact records.
