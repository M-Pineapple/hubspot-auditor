name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Guard release version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          EXPECTED="v${PKG_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Git tag '${TAG}' does not match package.json version (expected '${EXPECTED}')."
            exit 1
          fi
          if [ "$SERVER_VERSION" != "$PKG_VERSION" ]; then
            echo "server.json version '${SERVER_VERSION}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$PKG_VERSION" ]; then
            echo "server.json packages[0].version '${PACKAGE_VERSION}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          echo "Release versions match: ${EXPECTED}"

      - run: npm publish

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher

      - name: Publish to MCP Registry
        run: mcp-publisher login github-oidc && mcp-publisher publish
