name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mcp_registry_only:
        description: Skip npm publish and only publish server.json to the MCP Registry
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Pinned. Bump deliberately. npm Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@12.2.2

      - run: npm ci

      - run: npm test

      - name: Guard release version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          if [ "$SERVER_VERSION" != "$PKG_VERSION" ]; then
            echo "server.json version '${SERVER_VERSION}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$PKG_VERSION" ]; then
            echo "server.json packages[0].version '${PACKAGE_VERSION}' does not match package.json version '${PKG_VERSION}'."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            EXPECTED="v${PKG_VERSION}"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "Git tag '${TAG}' does not match package.json version (expected '${EXPECTED}')."
              exit 1
            fi
            echo "Release versions match: ${EXPECTED}"
          else
            echo "MCP Registry publish for ${PKG_VERSION} (event: ${GITHUB_EVENT_NAME})."
          fi

      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event.inputs.mcp_registry_only }}" = "true" ]; then
            echo "Skipping npm publish (mcp_registry_only)."
            exit 0
          fi
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm. Skipping npm publish."
            exit 0
          fi
          npm publish

      - name: Install mcp-publisher
        env:
          # Pinned release and checksum. Bump both together.
          MCP_PUBLISHER_VERSION: v1.8.8
          MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if mcp-publisher publish; then
              echo "MCP Registry publish succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "MCP Registry publish failed after 5 attempts."
              exit 1
            fi
            echo "Attempt ${attempt} failed. Waiting 45s for npm to propagate, then retrying."
            sleep 45
          done
