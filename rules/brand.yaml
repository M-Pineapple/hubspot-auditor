version: 1
auditor: brand
checks:
  - id: brand.published-pages
    title: Published landing pages
    severity: high
  - id: brand.page-meta
    title: Landing page titles and descriptions
    severity: medium
  - id: brand.page-tracking
    title: Tracking on landing pages
    severity: high
  - id: brand.page-cta
    title: Landing page call to action
    severity: high
    params:
      patterns: ["hs-cta", "hs-form", "hs-button"]
  - id: brand.logo
    title: Logo on landing pages
    severity: high
  - id: brand.favicon
    title: Favicon on landing pages
    severity: medium
  - id: brand.heading
    title: Page heading
    severity: medium
  - id: brand.colours
    title: Landing page colour palette
    severity: medium
    params:
      maxColours: 8
  - id: brand.markers
    title: Extra brand phrases
    severity: low
    params:
      markers: []
