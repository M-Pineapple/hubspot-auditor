version: 1
auditor: integrations
checks:
  - id: integrations.connected-apps
    title: Connected apps
    severity: low
  - id: integrations.webhook-subscriptions
    title: Webhook subscriptions
    severity: medium
  - id: integrations.sync-errors
    title: Sync errors
    severity: high
  - id: integrations.token-scopes
    title: Token scopes
    severity: high
    params:
      writeSuffixes: [".write", ".delete", ".publish"]
      writeScopes: ["crm.import", "timeline", "transactional-email", "social", "e-commerce", "files", "hubdb"]
      broadScopes: ["content", "forms", "automation"]
